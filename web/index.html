<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8b5cf6" />

    <title>Pick'Em — typuj mecze esportowe</title>
    <meta
      name="description"
      content="Platforma Pick'Em dla społeczności esportowej — typuj mecze CS2, śledź rankingi i rywalizuj z innymi graczami."
    />

    <!-- Open Graph: domyślne tagi dla całej strony. Dla /public/event/:slug
         server/index.js podmienia tytuł i opis na nazwę konkretnego eventu
         (Discord/komunikatory nie wykonują JS przy budowaniu podglądu linku,
         więc podmiana musi nastąpić po stronie serwera). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pick'Em" />
    <meta property="og:title" content="Pick'Em — typuj mecze esportowe" />
    <meta
      property="og:description"
      content="Platforma Pick'Em dla społeczności esportowej — typuj mecze CS2, śledź rankingi i rywalizuj z innymi graczami."
    />
    <!-- Obrazek podglądu linku. To jest pierwsza rzecz, jaką widzi ktoś,
         komu wkleimy adres na Discordzie - bez niego karta jest wąskim
         paskiem samego tekstu, z nim zajmuje pół wiadomości.

         Adres MUSI być bezwzględny: podglądy budują boty, które nie mają
         względem czego rozwinąć "/og.jpg".

         JPEG, nie PNG: ta sama grafika w PNG waży 693 kB, bo poświata to
         gradient, a gradienty PNG koduje bezlitośnie. 64 kB kontra 693 kB
         przy różnicy niewidocznej gołym okiem. -->
    <meta property="og:url" content="https://pickembot.pl/" />
    <meta property="og:image" content="https://pickembot.pl/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="PickEmBot — typuj mecze CS2 i rywalizuj ze swoją społecznością"
    />

    <!-- summary_large_image daje szeroką kartę zamiast miniatury z boku. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://pickembot.pl/og.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
